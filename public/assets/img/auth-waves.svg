<svg width="900" height="700" viewBox="0 0 900 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgWave1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B3473" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A485BC" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="bgWave2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B4AA3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#CDB9E2" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2ECF8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#D8C6EA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A485BC" stop-opacity="0"/>
    </linearGradient>

    <filter id="modernGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <path 
    d="M-100,800 C200,800 450,200 1000,-50 L1000,800 Z" 
    fill="url(#bgWave1)" 
    filter="url(#modernGlow)" 
  />
  <path 
    d="M-100,800 C300,700 550,300 1000,50 L1000,800 Z" 
    fill="url(#bgWave2)" 
  />

  <path 
    d="M-50,650 C 250,650 450,150 1000,-50" 
    stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round" 
  />
  <path 
    d="M-50,690 C 270,690 470,190 1000,-10" 
    stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" 
  />
  <path 
    d="M-50,730 C 290,730 490,230 1000,30" 
    stroke="url(#lineGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" 
  />
  <path 
    d="M-50,770 C 310,770 510,270 1000,70" 
    stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" opacity="0.4" 
  />
  <path 
    d="M-50,810 C 330,810 530,310 1000,110" 
    stroke="url(#lineGrad)" stroke-width="1" stroke-linecap="round" opacity="0.2" 
  />
</svg>